<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 850px;
      background: #0B0F19;
      padding: 30px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Browser Mockup Window */
    .browser-window {
      width: 1140px;
      background: #1E293B;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
    }

    /* Browser Top Bar */
    .browser-top-bar {
      height: 48px;
      background: #0F172A;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .traffic-lights {
      display: flex;
      gap: 8px;
    }

    .light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .red { background: #EF4444; }
    .yellow { background: #F59E0B; }
    .green { background: #10B981; }

    /* Address Bar */
    .address-bar {
      flex: 1;
      height: 32px;
      background: #030712;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      font-family: monospace;
      font-size: 13px;
    }

    .url-icon { color: #10B981; }
    .url-text { color: #F8FAFC; font-weight: 600; }
    .url-path { color: #38BDF8; font-weight: bold; }

    .badge-ip {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38BDF8;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: auto;
    }

    /* Web Content Frame */
    .browser-content {
      width: 100%;
      height: 720px;
      border: none;
    }
  </style>
</head>
<body>
  <div class="browser-window">
    <div class="browser-top-bar">
      <div class="traffic-lights">
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
      </div>
      <div class="address-bar">
        <span class="url-icon">🌐</span>
        <span class="url-text">http://</span>
        <span class="url-path">3.39.0.62</span>
        <span class="url-text">/</span>
        <span class="badge-ip">AWS Public IPv4 (Seoul: ap-northeast-2)</span>
      </div>
    </div>
    <iframe class="browser-content" src="http://3.39.0.62"></iframe>
  </div>
</body>
</html>
